AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: The Adventure backend deployed on AWS Lambda with FastAPI and Gemini.

Globals:
  Function:
    Runtime: python3.11
    Timeout: 90
    MemorySize: 1024
    Architectures:
      - x86_64

Parameters:
  GeminiApiKeys:
    Type: String
    NoEcho: true
    Description: Comma-separated Gemini API keys for story generation.
  DatabaseUrl:
    Type: String
    Description: Production database URL. Use PostgreSQL for Lambda deployments.
  AllowedOrigins:
    Type: String
    Default: ""
    Description: Comma-separated CORS origins.
  ApiPrefix:
    Type: String
    Default: /api
  DebugMode:
    Type: String
    Default: "False"
    AllowedValues:
      - "True"
      - "False"
  GeminiModel:
    Type: String
    Default: gemini-3.1-flash-lite

Resources:
  AdventureApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda_handler.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
              Resource: !Ref StoryWorkflowStateMachine
      Environment:
        Variables:
          GEMINI_API_KEYS: !Ref GeminiApiKeys
          DATABASE_URL: !Ref DatabaseUrl
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          API_PREFIX: !Ref ApiPrefix
          DEBUG: !Ref DebugMode
          GEMINI_MODEL: !Ref GeminiModel
          JOB_EXECUTION_MODE: workflow
          STORY_WORKFLOW_ARN: !Ref StoryWorkflowStateMachine
          AWS_REGION: !Ref AWS::Region
      FunctionUrlConfig:
        AuthType: NONE
  StoryWorkflowFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: workflow_handler.handler
      Timeout: 120
      Environment:
        Variables:
          GEMINI_API_KEYS: !Ref GeminiApiKeys
          DATABASE_URL: !Ref DatabaseUrl
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          API_PREFIX: !Ref ApiPrefix
          DEBUG: !Ref DebugMode
          GEMINI_MODEL: !Ref GeminiModel
          JOB_EXECUTION_MODE: workflow
          STORY_WORKFLOW_ARN: !Ref StoryWorkflowStateMachine
          AWS_REGION: !Ref AWS::Region
  StoryWorkflowStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: EXPRESS
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref StoryWorkflowFunction
      Definition:
        StartAt: ProcessStoryStep
        States:
          ProcessStoryStep:
            Type: Task
            Resource: !GetAtt StoryWorkflowFunction.Arn
            ResultPath: $
            Retry:
              - ErrorEquals:
                  - Lambda.ServiceException
                  - Lambda.AWSLambdaException
                  - Lambda.SdkClientException
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 2.0
            Next: CheckStatus
          CheckStatus:
            Type: Choice
            Choices:
              - Variable: $.status
                StringEquals: completed
                Next: WorkflowSucceeded
              - Variable: $.status
                StringEquals: failed
                Next: WorkflowFailed
            Default: WaitAndContinue
          WaitAndContinue:
            Type: Wait
            Seconds: 10
            Next: ProcessStoryStep
          WorkflowSucceeded:
            Type: Succeed
          WorkflowFailed:
            Type: Fail
            Cause: Story generation failed

Outputs:
  AdventureApiUrl:
    Description: Public Function URL for the backend API.
    Value: !GetAtt AdventureApiFunctionUrl.FunctionUrl
  StoryWorkflowArn:
    Description: Step Functions workflow ARN for story generation.
    Value: !Ref StoryWorkflowStateMachine
